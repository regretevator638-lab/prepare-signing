name: Generate iOS Certs
on:
  workflow_dispatch: # กดรันเองด้วยมือจากหน้า GitHub

jobs:
  build:
    runs-on: macos-latest # เรียกใช้เครื่อง Mac จำลองฟรีจาก GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Fetch Certificates (The Core)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          # ตรงนี้คือส่วนที่พี่ต้องเขียนสคริปต์สั่ง Fastlane 
          # ให้ไปคุยกับ Apple เพื่อเอา .p12 และ .mobileprovision ออกมา
          echo "เริ่มกระบวนการดึงไฟล์จาก Apple..."
          # fastlane sigh --development (ตัวอย่างคำสั่งดึงไฟล์ฟันเฟือง)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: ./*.mobileprovision # สั่งให้เก็บไฟล์ฟันเฟืองที่ได้ออกมาให้พี่โหลด
