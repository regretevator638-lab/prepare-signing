name: Get My P12 (Virtual Device Support)
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'กรอกรหัส 2FA 6 ตัว (ถ้ามี)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install & Run
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          TWO_FACTOR: ${{ github.event.inputs.two_factor_code }}
        run: |
          npm install
          mkdir -p MyCertificates
          
          # รันบอทโดยส่งรหัส 2FA (ถ้าพี่ใส่มาในช่อง Input)
          echo "$TWO_FACTOR" | node index.js > MyCertificates/apple_shouting.txt 2>&1 || echo "Finished"
          
          # ค้นหาแบบ "ขุดรากถอนโคน" (หาทุกที่ในเครื่อง)
          find . -maxdepth 3 -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -maxdepth 3 -name "*.mobileprovision" -exec cp {} MyCertificates/ \;
          
          # เช็กดูว่าเจออะไรบ้าง
          ls -R MyCertificates/ >> MyCertificates/apple_shouting.txt

      - name: Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Attempt with Virtual Device" || echo "No changes"
          git push
