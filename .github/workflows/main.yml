name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
        run: |
          # รันและบังคับให้โชว์ Error ถ้า Apple ไม่ให้ไฟล์
          node index.js
          
          mkdir -p MyCertificates
          # ค้นหาแบบขุดรากถอนโคน
          find . -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -name "*.mobileprovision" -exec cp {} MyCertificates/ \;
          echo "Last run: $(date)" > MyCertificates/status.txt

      - name: Save Files back to Code Tab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Check for certs again" || echo "No changes"
          git push
