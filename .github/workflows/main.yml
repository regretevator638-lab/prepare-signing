name: Find My Certificate
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'กรอกรหัส 2FA 6 ตัว (ถ้าเด้งในมือถือ)'
        required: false

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Run Original Script
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          TWO_FACTOR: ${{ github.event.inputs.two_factor_code }}
        run: |
          npm install
          mkdir -p MyCertificates
          
          # รันตัว index.js ของเจ้าของเดิมที่พี่ก๊อปมา
          echo "$TWO_FACTOR" | node index.js > MyCertificates/debug_log.txt 2>&1 || echo "Script failed"
          
          # ค้นหาไฟล์ .p12 แบบ "งมเข็ม" ทั่วเครื่องจำลอง
          echo "--- รายชื่อไฟล์ทั้งหมดที่หาเจอ ---" >> MyCertificates/debug_log.txt
          find . -type f \( -name "*.p12" -o -name "*.mobileprovision" \) >> MyCertificates/debug_log.txt
          
          # ถ้าเจอ ให้ก๊อปมาใส่โฟลเดอร์ที่เราจะส่งกลับ
          find . -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -name "*.mobileprovision" -exec cp {} MyCertificates/ \;

      - name: Push to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Searching for hidden files" || echo "No changes"
          git push
