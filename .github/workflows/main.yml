name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          # ใช้คำสั่ง DEBUG เพื่อดูว่ามันติดที่ขั้นตอนไหน
          DEBUG=app-store-connect* node index.js || echo "Failed but moving to next step..."
          
          # สร้างโฟลเดอร์เก็บไฟล์ (ถ้ามันสร้างไฟล์สำเร็จ)
          mkdir -p output
          cp *.p12 output/ 2>/dev/null || true
          cp *.mobileprovision output/ 2>/dev/null || true

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: output/
          if-no-files-found: warn
