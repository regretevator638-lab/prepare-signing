name: Get My P12 Fixed
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'รหัส 2FA 6 ตัว (ถ้ามี)'
        required: false

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Clean & Run
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          TWO_FACTOR: ${{ github.event.inputs.two_factor_code }}
        run: |
          npm install
          mkdir -p MyCertificates
          
          # ใช้สคริปต์ช่วยทำความสะอาดรหัสผ่านก่อนรัน
          export CLEAN_PASS=$(echo "$APPLE_PASSWORD" | xargs)
          
          # รันบอท
          echo "$TWO_FACTOR" | node index.js > MyCertificates/apple_shouting.txt 2>&1 || echo "Failed"
          
          find . -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -name "*.mobileprovision" -exec cp {} MyCertificates/ \;

      - name: Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Fixed PEM error" || echo "No changes"
          git push
