name: Get My P12 Final Boss
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Generate Certificates via Fastlane
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
        run: |
          # สร้างโฟลเดอร์รอ
          mkdir -p MyCertificates
          
          # ใช้ Fastlane ดึงใบเซอร์โดยตรง (วิธีนี้มาตรฐานและชัวร์สุด)
          fastlane spaceship create_certificate --type ios_development --username "$APPLE_ID" --password "$APPLE_PASSWORD" || echo "Cert failed"
          
          # ค้นหาและดึงไฟล์
          find . -maxdepth 2 -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -maxdepth 2 -name "*.mobileprovision" -exec cp {} MyCertificates/ \;
          
          # บันทึก log แบบละเอียดเพื่อดูว่าติดตรงไหน
          echo "รันล่าสุด: $(date)" > MyCertificates/status.txt
          if [ ! -f MyCertificates/*.p12 ]; then
            echo "สถานะ: Apple ไม่ส่งไฟล์ให้ รบกวนพี่เช็ก APPLE_PASSWORD (App-Specific) ในหน้า Secrets อีกทีนะครับ" >> MyCertificates/status.txt
          fi

      - name: Push to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Final attempt with Fastlane" || echo "No changes"
          git push
