name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write # สำคัญมาก! เพื่อให้ Actions มีสิทธิ์เซฟไฟล์กลับเข้าหน้า Code
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          node index.js
          # สร้างโฟลเดอร์ชื่อ MyCertificates เพื่อเก็บไฟล์ในหน้า Code
          mkdir -p MyCertificates
          find . -maxdepth 1 -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -maxdepth 1 -name "*.mobileprovision" -exec cp {} MyCertificates/ \;

      - name: Save Files back to Code Tab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Add generated certificates" || echo "No changes to commit"
          git push
