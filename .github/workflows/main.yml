name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
        run: |
          npm install
          node index.js
          # สร้างโฟลเดอร์เก็บไฟล์
          mkdir -p output
          cp *.p12 output/ 2>/dev/null || true
          cp *.mobileprovision output/ 2>/dev/null || true

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: output/
