name: Fetch iOS Certificates & Provisioning Profiles

on:
  workflow_dispatch:
    inputs:
      app_identifier:
        description: 'App Bundle ID (e.g. com.yourname.app)'
        required: true
        default: 'com.example.myapp'

jobs:
  fetch-certs:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Create Output Directory
        run: mkdir -p ./certs-output

      - name: Fetch Development Certificate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          fastlane run get_certificates \
            development:true \
            username:"$APPLE_ID" \
            team_id:"IAJTAPZQYCLT" \
            output_path:"./certs-output" \
            generate_apple_certs:true

      - name: Fetch Development Provisioning Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          fastlane run get_provisioning_profile \
            development:true \
            username:"$APPLE_ID" \
            team_id:"IAJTAPZQYCLT" \
            app_identifier:"${{ github.event.inputs.app_identifier }}" \
            output_path:"./certs-output" \
            force:true \
            skip_install:true

      - name: Convert to P12
        run: |
          cd ./certs-output
          CER_FILE=$(find . -name "*.cer" | head -1)
          KEY_FILE=$(find . -name "*.p12" | head -1)
          if [ -n "$CER_FILE" ] && [ -z "$KEY_FILE" ]; then
            echo "Converting $CER_FILE to .p12..."
            security import "$CER_FILE" -k ~/Library/Keychains/login.keychain-db
            security export \
              -k ~/Library/Keychains/login.keychain-db \
              -t identities \
              -f pkcs12 \
              -P "1234" \
              -o "development_certificate.p12"
            echo "Done!"
          elif [ -n "$KEY_FILE" ]; then
            echo "P12 already exists: $KEY_FILE"
          else
            echo "No certificate found!"
            exit 1
          fi

      - name: List Files
        run: ls -lah ./certs-output/

      - name: Upload Certificate
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-certificate
          path: ./certs-output/*.p12
          retention-days: 3
          if-no-files-found: error

      - name: Upload Provisioning Profile
        uses: actions/upload-artifact@v4
        with:
          name: ios-provisioning-profile
          path: ./certs-output/*.mobileprovision
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf ./certs-output
