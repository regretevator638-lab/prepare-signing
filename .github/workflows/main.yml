name: Fetch iOS Certificates & Provisioning Profiles

on:
  workflow_dispatch:
    inputs:
      app_identifier:
        description: 'App Bundle ID (e.g. com.yourname.app)'
        required: true
        default: 'com.example.myapp'

jobs:
  fetch-certs:
    runs-on: macos-latest

    steps:
      # ─── 1. เตรียมเครื่อง ──────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Create Output Directory
        run: mkdir -p ./certs-output

      # ─── 2. ดึงใบเซอร์ (.cer) ──────────────────────────────────
      - name: Fetch Development Certificate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          fastlane cert \
            --development \
            --username "$APPLE_ID" \
            --team_id "IAJTAPZQYCLT" \
            --output_path "./certs-output" \
            --generate_apple_certs true \
            --skip_set_partition_list true \
            --skip_itc true

      # ─── 3. ดึง Profile (.mobileprovision) ─────────────────────
      - name: Fetch Development Provisioning Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          fastlane sigh \
            --development \
            --username "$APPLE_ID" \
            --team_id "IAJTAPZQYCLT" \
            --app_identifier "${{ github.event.inputs.app_identifier }}" \
            --output_path "./certs-output" \
            --force \
            --skip_install \
            --skip_itc true

      # ─── 4. แปลงร่างเป็น .p12 (ดึงจาก Keychain ระบบ) ────────────
      - name: Convert to P12
        run: |
          cd ./certs-output
          CER_FILE=$(find . -name "*.cer" | head -1)
          if [ -n "$CER_FILE" ]; then
            echo "✅ พบไฟล์ .cer กำลังเริ่มแปลงเป็น .p12..."
            # ใช้พาสเวิร์ด 1234 เป็นค่ามาตรฐานสำหรับไฟล์ P12 (เอาไว้ใส่ในแอป Sign)
            security import "$CER_FILE" -k ~/Library/Keychains/login.keychain-db
            security export \
              -k ~/Library/Keychains/login.keychain-db \
              -t identities \
              -f pkcs12 \
              -P "1234" \
              -o "certificate_for_sign.p12"
            echo "✅ แปลงไฟล์สำเร็จ!"
          else
            echo "❌ ไม่พบไฟล์ใบเซอร์ที่จะแปลง!"
            exit 1
          fi

      # ─── 5. ส่งไฟล์ให้พี่บอสโหลด ───────────────────────────────
      - name: List & Upload Results
        run: ls -lah ./certs-output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ready-to-sign
          path: ./certs-output/*
          retention-days: 3
