name: Fetch iOS Certificates & Provisioning Profiles

on:
  workflow_dispatch:
    inputs:
      app_identifier:
        description: 'App Bundle ID (e.g. com.yourname.app)'
        required: true
        default: 'com.example.myapp'

jobs:
  fetch-certs:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Configure Fastlane Session
        env:
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          if [ -n "$FASTLANE_SESSION" ]; then
            echo "FASTLANE_SESSION=$FASTLANE_SESSION" >> $GITHUB_ENV
          fi

      - name: Create Output Directory
        run: mkdir -p ./certs-output

      # ─── 5. ดึงใบเซอร์ (ใช้โหมดบังคับข้าม App Store Connect) ───────
      - name: Fetch Development Certificate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # บังคับให้บอทรู้ว่าทีมนี้แหละคือบ้านของเรา
          FASTLANE_TEAM_ID: 'IAJTAPZQYCLT' 
        run: |
          fastlane cert \
            --development \
            --username "$APPLE_ID" \
            --team_id "IAJTAPZQYCLT" \
            --output_path "./certs-output" \
            --platform "ios" \
            --skip_itc true

      # ─── 6. ดึง Provisioning Profile (โหมดบัญชีฟรี) ──────────────
      - name: Fetch Development Provisioning Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_TEAM_ID: 'IAJTAPZQYCLT'
        run: |
          fastlane sigh \
            --development \
            --username "$APPLE_ID" \
            --team_id "IAJTAPZQYCLT" \
            --app_identifier "${{ github.event.inputs.app_identifier }}" \
            --output_path "./certs-output" \
            --force \
            --skip_install \
            --skip_itc true

      - name: List & Upload Results
        run: |
          ls -lah ./certs-output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-p12-package
          path: ./certs-output/*
