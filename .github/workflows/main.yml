name: Fastlane P12 Grabber
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'กรอกรหัส 2FA 6 ตัว (ถ้าเด้งในมือถือ)'
        required: false
      p12_password:
        description: 'ตั้งรหัสผ่านไฟล์ P12'
        required: true
        default: '123456'

jobs:
  fastlane_run:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Fastlane
        run: brew install fastlane

      - name: Grab Certificates
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER: "" 
          # ดึงรหัส 2FA จากหน้าจอที่พี่กรอก
          FASTLANE_OTP: ${{ github.event.inputs.two_factor_code }}
          # ดึงรหัส P12 จากหน้าจอที่พี่กรอก
          P12_PASSWORD: ${{ github.event.inputs.p12_password }}
        run: |
          # ตรงนี้คือส่วนที่บอทจะเริ่มทำงานต่อ
          # มันจะหยิบค่า P12_PASSWORD ไปใช้ปั๊มไฟล์ให้พี่ครับ
          echo "เริ่มต้นการปั๊มใบเซอร์ด้วยรหัสที่พี่ตั้งไว้..."
