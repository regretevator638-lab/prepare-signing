name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: |
          npm install
          # ติดตั้งตัวช่วยจัดการ Apple Session
          sudo gem install fastlane

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
        run: |
          # ลบไฟล์เก่าทิ้งก่อนเริ่มใหม่
          rm -f *.p12 *.mobileprovision
          
          # รันตัวสร้างไฟล์
          node index.js || echo "Script finished with some warnings"
          
          # สร้างโฟลเดอร์และดึงไฟล์
          mkdir -p MyCertificates
          find . -maxdepth 2 -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -maxdepth 2 -name "*.mobileprovision" -exec cp {} MyCertificates/ \;

      - name: Save Files back to Code Tab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Update certificates" || echo "No changes to commit"
          git push
