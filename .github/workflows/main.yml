name: Get My P12 (Manual 2FA)
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'กรอกรหัส 6 ตัวที่เด้งในไอโฟน (ถ้ามี)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Generate P12
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          TWO_FACTOR_CODE: ${{ github.event.inputs.two_factor_code }} # ดึงรหัสจากช่องที่พี่กรอก
        run: |
          mkdir -p MyCertificates
          # สั่งรันโดยส่งรหัส 2FA เข้าไปด้วย (ถ้ามี)
          echo "$TWO_FACTOR_CODE" | node index.js > MyCertificates/apple_shouting.txt 2>&1 || echo "Process finished"
          
          find . -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -name "*.mobileprovision" -exec cp {} MyCertificates/ \;
          
          echo "Run at: $(date)" >> MyCertificates/apple_shouting.txt

      - name: Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Attempt with 2FA Code" || echo "No changes"
          git push
