name: Fetch iOS Certificates & Provisioning Profiles

on:
  workflow_dispatch:
    inputs:
      app_identifier:
        description: 'App Bundle ID (e.g. com.yourname.app)'
        required: true
        default: 'com.example.myapp'

jobs:
  fetch-certs:
    runs-on: macos-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Setup Ruby + Fastlane ──────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      # ─── 3. Configure Fastlane Session ─────────────────────────
      - name: Configure Fastlane Session for 2FA
        env:
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: |
          if [ -n "$FASTLANE_SESSION" ]; then
            echo "✅ Using FASTLANE_SESSION for 2FA bypass"
            echo "FASTLANE_SESSION=$FASTLANE_SESSION" >> $GITHUB_ENV
          else
            echo "⚠️ No FASTLANE_SESSION found."
          fi

      # ─── 4. Create output directory ────────────────────────────
      - name: Create Output Directory
        run: mkdir -p ./certs-output

      # ─── 5. Fetch Development Certificate (.p12) ───────────────
      - name: Fetch Development Certificate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: 'AJTAPZQYCLT' # อัปเดตเป็นเลขจากรูป Sideloadly แล้วครับ!
        run: |
          fastlane cert \
            --development \
            --username "$APPLE_ID" \
            --team_id "$TEAM_ID" \
            --output_path "./certs-output" \
            --platform "ios"

      # ─── 6. Fetch Development Provisioning Profile ─────────────
      - name: Fetch Development Provisioning Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: 'AJTAPZQYCLT'
        run: |
          fastlane sigh \
            --development \
            --username "$APPLE_ID" \
            --team_id "$TEAM_ID" \
            --app_identifier "${{ github.event.inputs.app_identifier }}" \
            --output_path "./certs-output" \
            --force \
            --skip_install \
            --skip_itc

      # ─── 7. List & Upload Results ──────────────────────────────
      - name: List Generated Files
        run: |
          echo "📁 Files in ./certs-output:"
          ls -lah ./certs-output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-p12-package
          path: ./certs-output/*
          retention-days: 3
