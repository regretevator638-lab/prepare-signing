name: Get My P12
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Generate P12 and Profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
        run: |
          # 1. รันตัวเจนไฟล์
          node index.js || echo "Script might have issues"
          
          # 2. สร้างโฟลเดอร์รอไว้เลย
          mkdir -p MyCertificates
          
          # 3. ค้นหาไฟล์แบบละเอียด (หาทุกซอกทุกมุมในเครื่องจำลอง)
          find . -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -name "*.mobileprovision" -exec cp {} MyCertificates/ \;
          
          # 4. สร้างไฟล์เช็กชื่อ (ถ้าพี่เห็นไฟล์นี้ในหน้า Code แสดงว่าระบบเซฟสำเร็จ)
          echo "Bot worked at $(date)" > MyCertificates/status.txt

      - name: Save Files back to Code Tab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Update certificates and status" || echo "No changes to commit"
          git push
