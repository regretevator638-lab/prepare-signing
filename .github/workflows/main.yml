name: Get My P12 Fixed
on:
  workflow_dispatch:
    inputs:
      two_factor_code:
        description: 'กรอกรหัส 2FA 6 ตัวที่เด้งในมือถือ (ถ้าไม่มีให้เว้นว่าง)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Clean & Run
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          TWO_FACTOR: ${{ github.event.inputs.two_factor_code }}
        run: |
          npm install
          mkdir -p MyCertificates
          
          # ส่งรหัส 2FA เข้าไปในโปรแกรม (ถ้าพี่กรอกมา)
          echo "$TWO_FACTOR" | node index.js > MyCertificates/apple_shouting.txt 2>&1 || echo "Process finished"
          
          # เก็บไฟล์ใบเซอร์
          find . -maxdepth 2 -name "*.p12" -exec cp {} MyCertificates/ \;
          find . -maxdepth 2 -name "*.mobileprovision" -exec cp {} MyCertificates/ \;

      - name: Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyCertificates/
          git commit -m "Attempt with 2FA Input" || echo "No changes"
          git push
